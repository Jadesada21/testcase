service:
  mongo:
  image: mongo:8
  container_name: cinema-mongo
  ports:
    - "27017:27017"
  volumes:
    - mongo-data:/data/db

redis:
  image: redis:alpine
  container_name: cinema-redis
  ports:
    - "6379:6379"

backend:
  build:
    context: ./backend
    dockerfile: Dockerfile
  container_name: cinema-backend
  ports:
    - "3000:3000"
  env_file:
    - ./backend/.env
  depends_on:
    - mongo
    - redis

frontend:
  build:
    context: ./frontend
    dockerfile: Dockerfile
  container_name: cinema-frontend
  ports:
    - "5173:80"
  depends_on:
    - backend

volumes: mongo-data
